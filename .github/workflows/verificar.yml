name: Verificar canais

on:
  schedule:
    - cron: "17 8 * * *"   # todo dia às 05:17 de Brasília
  workflow_dispatch:        # permite rodar na hora pelo botão "Run workflow"
  push:
    paths: ["sinais.m3u", "manter.txt", "verificar.py"]

permissions:
  contents: write

concurrency:
  group: verificar
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python verificar.py
      - name: Publicar resultado
        run: |
          git config user.name "verificador"
          git config user.email "verificador@users.noreply.github.com"
          git add catalogo.json estado.json RELATORIO.md
          git diff --cached --quiet || git commit -m "Verificação automática dos canais"
          git push
